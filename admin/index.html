<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel admin – Verde Nilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<section id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">🌿 Verde Nilo</div>
    <div class="login-sub">Panel de administración</div>
    <div id="login-error" class="error-msg"></div>
    <form id="login-form">
      <label for="login-email">Correo</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
      </div>
    </form>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" style="display:none">
  <header class="admin-header">
    <h1>🌿 Verde Nilo<small>Panel de administración</small></h1>
    <button id="logout-btn" class="btn btn-secondary">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <!-- FORM -->
    <div class="panel">
      <h2 id="form-title">Nuevo producto</h2>
      <div id="form-error" class="error-msg"></div>
      <form id="product-form">
        <label for="p-name">Nombre</label>
        <input type="text" id="p-name" required placeholder="Ej: TouBag Selva">

        <label for="p-description">Descripción</label>
        <textarea id="p-description" placeholder="Detalles, medidas, materiales..."></textarea>

        <label for="p-price">Precio (CLP)</label>
        <input type="number" id="p-price" min="0" step="1" required placeholder="Ej: 25000">

        <label for="p-type">Tipo de producto</label>
        <input type="text" id="p-type" list="p-type-options" placeholder="Ej: bolso, accesorio">
        <datalist id="p-type-options"></datalist>

        <label>Fotos</label>
        <div id="image-grid" class="image-grid"></div>
        <input type="file" id="p-images" accept="image/*" multiple>
        <div class="upload-hint">Puedes seleccionar varias fotos a la vez. Se suben automáticamente.</div>

        <label>Menús</label>
        <div class="checkbox-row">
          <label><input type="checkbox" id="tag-temporada" value="temporada"> Temporada</label>
          <label><input type="checkbox" id="tag-ofertas" value="ofertas"> Ofertas</label>
          <label><input type="checkbox" id="tag-nuevos" value="nuevos_ingresos"> Nuevos ingresos</label>
        </div>

        <label for="p-status">Estado</label>
        <select id="p-status">
          <option value="disponible">Disponible</option>
          <option value="vendido">Vendido</option>
          <option value="oculto">Oculto (borrador)</option>
        </select>

        <div class="checkbox-row" style="margin-top:14px">
          <label><input type="checkbox" id="p-featured"> Destacar en portada</label>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn btn-primary">Guardar</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display:none">Cancelar edición</button>
        </div>
      </form>
    </div>

    <!-- PRODUCT LIST -->
    <div class="panel">
      <div class="product-list-header">
        <h2 style="margin:0">Productos</h2>
        <span id="product-count" class="product-count"></span>
      </div>
      <div id="product-list">
        <div class="loading">Cargando productos…</div>
      </div>
    </div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
